<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculateur Cotisations - La Ruche & Le Silo</title>
    <style>
        :root {
            --bg-color: #1e1e24;
            --container-bg: #2b2b36;
            --card-bg: #343442;
            --text-color: #f0f0f0;
            --text-muted: #b0b0ba;
            --accent-yellow: #f1c40f;
            --accent-yellow-hover: #d4ac0d;
            --input-bg: #3b3b4a;
            --border-color: #4a4a5a;
            --remove-red: #e74c3c;
            --remove-red-hover: #c0392b;
        }

        * {
            box-sizing: border-box;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 12px; 
            color: var(--text-color); 
        }

        .container { 
            max-width: 650px; 
            margin: 0 auto; 
            background: var(--container-bg); 
            padding: 16px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4); 
        }

        /* En-tête */
        .header-title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .header-title-container img {
            width: 70px;
            height: auto;
            border-radius: 6px;
            flex-shrink: 0;
        }

        h1 { 
            color: var(--accent-yellow); 
            font-size: 18px; 
            margin: 0; 
            text-align: left;
            line-height: 1.2;
        }

        .form-group { 
            margin-bottom: 16px; 
        }

        label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 6px; 
            color: var(--text-color);
            font-size: 14px;
        }

        select, input[type="number"], input[type="date"] { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 16px; /* Évite le zoom auto iOS */
        }

        select:focus, input[type="number"]:focus, input[type="date"]:focus {
            outline: none;
            border-color: var(--accent-yellow);
        }

        /* Cartes Adhérents */
        .adherant-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 16px;
        }

        .adherant-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .adherant-title {
            font-size: 15px;
            font-weight: bold;
            color: var(--accent-yellow);
        }

        /* Lignes d'activités */
        .activite-item { 
            display: flex; 
            flex-wrap: wrap;
            gap: 8px; 
            margin-bottom: 10px; 
            align-items: center; 
            background: #2b2b36;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .activite-item input[type="number"] { 
            flex: 1 1 140px; 
        }

        .remise-label { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            font-size: 13px; 
            white-space: nowrap; 
            cursor: pointer;
            user-select: none;
            color: var(--text-muted);
            padding: 4px 0;
        }

        .remise-label input[type="checkbox"] { 
            width: 18px; 
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent-yellow);
        }

        /* Boutons */
        .btn-add-main { 
            background-color: var(--accent-yellow); 
            color: #1e1e24; 
            border: none; 
            border-radius: 8px; 
            padding: 14px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            margin-top: 8px; 
            transition: background-color 0.2s ease;
            font-size: 15px;
        }

        .btn-add-main:hover { 
            background-color: var(--accent-yellow-hover); 
        }

        .btn-add-sub {
            background-color: transparent;
            color: var(--accent-yellow);
            border: 1px dashed var(--accent-yellow);
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 4px;
            font-size: 14px;
        }

        .btn-remove { 
            background-color: var(--remove-red); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            padding: 8px 12px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 13px;
        }

        /* Résumé */
        .results { 
            background: #23232d; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            padding: 16px; 
            margin-top: 20px; 
        }

        .results h2 { 
            margin-top: 0; 
            color: var(--accent-yellow); 
            font-size: 16px; 
        }

        .price-line { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 8px; 
            font-size: 14px;
        }

        hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 10px 0;
        }

        .total { 
            font-size: 18px; 
            font-weight: bold; 
            color: var(--accent-yellow); 
        }

        .echeancier { 
            font-size: 13px; 
            color: var(--text-color); 
            background: var(--input-bg); 
            padding: 12px; 
            border-radius: 6px; 
            margin-top: 12px; 
            border: 1px solid var(--border-color);
            line-height: 1.5;
        }

        .echeancier ul {
            margin: 6px 0 0 0;
            padding-left: 20px;
        }

        @media (min-width: 480px) {
            .header-title-container img { width: 90px; }
            h1 { font-size: 20px; }
            .container { padding: 24px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title-container">
        <img src="https://static.wixstatic.com/media/f30902_142e7fd587df4d0a82f550984c04e1d6~mv2.png/v1/fill/w_250,h_250,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/f30902_142e7fd587df4d0a82f550984c04e1d6~mv2.png" alt="Logo La Ruche & Le Silo">
        <h1>Calculateur d'Adhésion & Activités</h1>
    </div>

    <div class="form-group">
        <label for="mois">Mois d'inscription (dégressivité au prorata) :</label>
        <select id="mois" onchange="calculerTotaux()">
            <option value="30">Septembre / Octobre (30 ateliers) — Plein tarif</option>
            <option value="26">Novembre (26 ateliers restants)</option>
            <option value="22">Décembre (22 ateliers restants)</option>
            <option value="18">Janvier (18 ateliers restants)</option>
            <option value="15">Février (15 ateliers restants)</option>
            <option value="12">Mars (12 ateliers restants)</option>
            <option value="10">Avril (10 ateliers restants)</option>
            <option value="6">Mai (6 ateliers restants)</option>
            <option value="3">Juin (3 ateliers restants)</option>
        </select>
    </div>

    <div id="adherants-container"></div>

    <button type="button" class="btn-add-main" onclick="ajouterAdherant()">➕ Ajouter un adhérent / membre</button>

    <div class="form-group" style="margin-top: 20px;">
        <label for="paiements">Nombre de versements :</label>
        <select id="paiements" onchange="calculerTotaux()">
            <option value="1">1 paiement (Comptant)</option>
            <option value="2">2 paiements</option>
            <option value="3">3 paiements</option>
            <option value="4">4 paiements</option>
        </select>
    </div>

    <div class="results">
        <h2>Résumé du calcul</h2>
        <div class="price-line"><span>Nombre d'adhérents :</span><span id="res-nb-adherants">1</span></div>
        <div class="price-line"><span>Sous-total Adhésions :</span><span id="res-adhesion">0.00 €</span></div>
        <div class="price-line"><span>Sous-total Activités (après dégressivité) :</span><span id="res-activites">0.00 €</span></div>
        <div class="price-line"><span>Réductions cumulées (20%) :</span><span id="res-reduction">-0.00 €</span></div>
        <hr>
        <div class="price-line total"><span>TOTAL À PAYER :</span><span id="res-total">0.00 €</span></div>
        
        <div id="echeancier-box" class="echeancier" style="display:none;">
            <strong>📌 Détail de l'échéancier :</strong>
            <ul id="res-echeancier-list"></ul>
        </div>
    </div>
</div>

<script>
const TOTAL_SEANCES_ANNEE = 30;
let adherantCounter = 0;

function ajouterAdherant() {
    adherantCounter++;
    const container = document.getElementById('adherants-container');
    const div = document.createElement('div');
    div.className = 'adherant-card';
    div.id = `adherant-${adherantCounter}`;

    const canRemove = container.children.length > 0;
    
    div.innerHTML = `
        <div class="adherant-header">
            <span class="adherant-title">👤 Adhérent ${container.children.length + 1}</span>
            ${canRemove ? `<button type="button" class="btn-remove" onclick="supprimerAdherant('${div.id}')">✕ Supprimer</button>` : ''}
        </div>

        <div class="form-group">
            <label>Date de naissance (optionnel) :</label>
            <input type="date" class="input-dob" onchange="ajusterAdhesionParAge(this)">
        </div>

        <div class="form-group">
            <label>Type d'adhésion :</label>
            <select class="input-age" onchange="calculerTotaux()">
                <option value="0" data-type="exoneration">Exonéré</option>
                <option value="0" data-type="0-2">0-2 ans : gratuite (0€)</option>
                <option value="5" data-type="3-5">3-5 ans : 5€/an</option>
                <option value="7" data-type="6-11">6-11 ans : 7€/an</option>
                <option value="10" data-type="12-17">12-17 ans : 10€/an</option>
                <option value="20" data-type="18+" selected>18 ans et + : 20€/an</option>
            </select>
        </div>

        <div class="form-group">
            <label>Activités pratiquées :</label>
            <div class="activites-container">
                <div class="activite-item">
                    <input type="number" class="input-activite" placeholder="Coût annuel (ex: 150)" min="0" step="any" oninput="calculerTotaux()">
                    <label class="remise-label">
                        <input type="checkbox" class="check-remise" onchange="calculerTotaux()"> Remise 20%
                    </label>
                </div>
            </div>
            <button type="button" class="btn-add-sub" onclick="ajouterActivite(this)">➕ Ajouter une activité</button>
        </div>
    `;

    container.appendChild(div);
    renumeroterAdherants();
    calculerTotaux();
}

function ajusterAdhesionParAge(inputDob) {
    const dobValue = inputDob.value;
    if (!dobValue) return;

    const dob = new Date(dobValue);
    const today = new Date();
    
    let age = today.getFullYear() - dob.getFullYear();
    const monthDiff = today.getMonth() - dob.getMonth();
    if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < dob.getDate())) {
        age--;
    }

    const card = inputDob.closest('.adherant-card');
    const selectAge = card.querySelector('.input-age');

    let targetType = "18+";
    if (age >= 0 && age <= 2) {
        targetType = "0-2";
    } else if (age >= 3 && age <= 5) {
        targetType = "3-5";
    } else if (age >= 6 && age <= 11) {
        targetType = "6-11";
    } else if (age >= 12 && age <= 17) {
        targetType = "12-17";
    } else {
        targetType = "18+";
    }

    for (let option of selectAge.options) {
        if (option.getAttribute('data-type') === targetType) {
            selectAge.value = option.value;
            option.selected = true;
            break;
        }
    }

    calculerTotaux();
}

function supprimerAdherant(id) {
    const el = document.getElementById(id);
    if (el) {
        el.remove();
        renumeroterAdherants();
        calculerTotaux();
    }
}

function renumeroterAdherants() {
    const cards = document.querySelectorAll('.adherant-card');
    cards.forEach((card, index) => {
        const title = card.querySelector('.adherant-title');
        if (title) title.innerText = `👤 Adhérent ${index + 1}`;
    });
}

function ajouterActivite(bouton) {
    const container = bouton.previousElementSibling;
    const div = document.createElement('div');
    div.className = 'activite-item';
    
    div.innerHTML = `
        <input type="number" class="input-activite" placeholder="Coût annuel (ex: 150)" min="0" step="any" oninput="calculerTotaux()">
        <label class="remise-label">
            <input type="checkbox" class="check-remise" onchange="calculerTotaux()"> Remise 20%
        </label>
        <button type="button" class="btn-remove" onclick="supprimerActivite(this)">✕</button>
    `;
    container.appendChild(div);
    calculerTotaux();
}

function supprimerActivite(bouton) {
    bouton.parentElement.remove();
    calculerTotaux();
}

function calculerTotaux() {
    const ateliersRestants = parseInt(document.getElementById('mois').value) || TOTAL_SEANCES_ANNEE;
    const ratioDegressif = ateliersRestants / TOTAL_SEANCES_ANNEE;

    const cards = document.querySelectorAll('.adherant-card');
    
    let totalAdhesions = 0;
    let totalActivitesBrutDegresse = 0;
    let totalReductions = 0;

    cards.forEach(card => {
        const selectAge = card.querySelector('.input-age');
        if (selectAge) {
            totalAdhesions += parseFloat(selectAge.value) || 0;
        }

        const itemsActivite = card.querySelectorAll('.activite-item');
        itemsActivite.forEach(item => {
            const inputPrix = item.querySelector('.input-activite');
            const checkRemise = item.querySelector('.check-remise');
            
            const valPrix = parseFloat(inputPrix.value);
            if (!isNaN(valPrix) && valPrix > 0) {
                let prixDegresse = valPrix * ratioDegressif;
                totalActivitesBrutDegresse += prixDegresse;

                if (checkRemise && checkRemise.checked) {
                    let montantRemise = prixDegresse * 0.20;
                    totalReductions += montantRemise;
                }
            }
        });
    });

    let totalActivitesNet = totalActivitesBrutDegresse - totalReductions;
    let totalGeneral = totalAdhesions + totalActivitesNet;

    document.getElementById('res-nb-adherants').innerText = cards.length;
    document.getElementById('res-adhesion').innerText = totalAdhesions.toFixed(2) + " €";
    document.getElementById('res-activites').innerText = totalActivitesBrutDegresse.toFixed(2) + " €";
    document.getElementById('res-reduction').innerText = "-" + totalReductions.toFixed(2) + " €";
    document.getElementById('res-total').innerText = totalGeneral.toFixed(2) + " €";

    // Échéancier : Adhésions au 1er versement + versements suivants arrondis à l'euro entier
    const nbPaiements = parseInt(document.getElementById('paiements').value) || 1;
    const echeancierBox = document.getElementById('echeancier-box');
    const echeancierList = document.getElementById('res-echeancier-list');
    
    if (nbPaiements > 1 && totalGeneral > 0) {
        echeancierBox.style.display = 'block';
        
        let versementSuivantEntier = Math.round(totalActivitesNet / nbPaiements);
        let totalVersementsSuivants = versementSuivantEntier * (nbPaiements - 1);
        let premierVersement = totalAdhesions + (totalActivitesNet - totalVersementsSuivants);

        let htmlEcheances = `<li><strong>1<sup>er</sup> versement :</strong> ${premierVersement.toFixed(2)} € <small style="color:var(--text-muted);">(Contient l'adhésion et l'ajustement des centimes)</small></li>`;
        
        if (nbPaiements === 2) {
            htmlEcheances += `<li><strong>2<sup>e</sup> versement :</strong> ${versementSuivantEntier} € <small style="color:var(--text-muted);">(montant entier)</small></li>`;
        } else {
            htmlEcheances += `<li><strong>${nbPaiements - 1} versements suivants :</strong> ${versementSuivantEntier} € / versement <small style="color:var(--text-muted);">(montants entiers)</small></li>`;
        }

        echeancierList.innerHTML = htmlEcheances;
    } else {
        echeancierBox.style.display = 'none';
    }
}

ajouterAdherant();
</script>

</body>
</html>
