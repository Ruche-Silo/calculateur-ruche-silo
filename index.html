<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur Cotisations - La Ruche & Le Silo</title>
    <style>
        :root {
            --bg-color: #1e1e24;
            --container-bg: #2b2b36;
            --card-bg: #323240;
            --text-color: #f0f0f0;
            --text-muted: #b0b0ba;
            --accent-yellow: #f1c40f;
            --accent-yellow-hover: #d4ac0d;
            --input-bg: #3b3b4a;
            --border-color: #4a4a5a;
            --remove-red: #e74c3c;
            --remove-red-hover: #c0392b;
            --success-green: #2ecc71;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 20px; 
            color: var(--text-color); 
        }

        .container { 
            max-width: 700px; 
            margin: 0 auto; 
            background: var(--container-bg); 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        h1 { 
            text-align: center; 
            color: var(--accent-yellow); 
            margin-top: 0;
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .section-title {
            color: var(--accent-yellow);
            font-size: 1.1rem;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .month-selector-box {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: 600; 
            font-size: 0.9rem;
            color: var(--text-color);
        }

        select, input[type="text"], input[type="number"], input[type="date"] { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid var(--border-color); 
            border-radius: 6px; 
            box-sizing: border-box; 
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--accent-yellow);
        }

        .adherent-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            position: relative;
        }

        .adherent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .adherent-title {
            font-weight: bold;
            color: var(--accent-yellow);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .activity-item {
            background: var(--input-bg);
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .activity-item input[type="number"] {
            flex: 1;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .checkbox-container input {
            cursor: pointer;
            accent-color: var(--accent-yellow);
        }

        .btn {
            background-color: var(--accent-yellow);
            color: #121212;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
            margin-top: 5px;
        }

        .btn:hover {
            background-color: var(--accent-yellow-hover);
        }

        .btn-small {
            padding: 5px 10px;
            font-size: 0.8rem;
            width: auto;
        }

        .btn-remove {
            background-color: var(--remove-red);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-remove:hover {
            background-color: var(--remove-red-hover);
        }

        .summary-box {
            background: #252530;
            border: 2px solid var(--accent-yellow);
            padding: 18px;
            border-radius: 8px;
            margin-top: 25px;
        }

        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .summary-header h3 {
            margin: 0;
            color: var(--accent-yellow);
        }

        .btn-copy {
            background-color: var(--accent-yellow);
            color: #121212;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-copy:hover {
            background-color: var(--accent-yellow-hover);
        }

        .btn-copy.copied {
            background-color: var(--success-green);
            color: white;
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .summary-total {
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            margin-top: 10px;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--accent-yellow);
        }

        .echeancier-box {
            background: #1a1a22;
            padding: 12px;
            border-radius: 6px;
            margin-top: 12px;
            border-left: 3px solid var(--accent-yellow);
        }

        .echeancier-title {
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--text-color);
            margin-bottom: 8px;
        }

        .echeancier-item {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .echeancier-item strong {
            color: var(--text-color);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Calculateur Cotisations</h1>

    <div class="month-selector-box">
        <label for="mois-inscription">Mois d'inscription (Prorata) :</label>
        <select id="mois-inscription" onchange="calculerTotaux()">
            <option value="30">Septembre - Octobre (30 séances - Tarif plein)</option>
            <option value="24">Novembre (24 séances)</option>
            <option value="21">Décembre (21 séances)</option>
            <option value="18">Janvier (18 séances)</option>
            <option value="15">Février (15 séances)</option>
            <option value="12">Mars (12 séances)</option>
            <option value="9">Avril (9 séances)</option>
            <option value="6">Mai (6 séances)</option>
            <option value="3">Juin (3 séances)</option>
        </select>
    </div>

    <div id="adherents-container"></div>

    <button type="button" class="btn" onclick="ajouterAdherent()">➕ Ajouter un adhérent / membre</button>

    <div style="margin-top: 20px;">
        <label for="paiements">Nombre de versements souhaité :</label>
        <select id="paiements" onchange="calculerTotaux()">
            <option value="1">1 versement (Comptant)</option>
            <option value="2">2 versements</option>
            <option value="3">3 versements</option>
            <option value="4">4 versements</option>
        </select>
    </div>

    <div class="summary-box">
        <div class="summary-header">
            <h3>Résumé du calcul</h3>
            <button class="btn-copy" id="btn-copy" onclick="copierPourFramaforms()">
                📋 Copier pour Framaforms
            </button>
        </div>

        <div class="summary-line">
            <span>Total Adhésions :</span>
            <span id="res-adhesion">0,00 €</span>
        </div>
        <div class="summary-line">
            <span>Total Activités (avec prorata) :</span>
            <span id="res-activites">0,00 €</span>
        </div>
        <div class="summary-line">
            <span>Total Réductions (20%) :</span>
            <span id="res-reduction" style="color: #e74c3c;">-0,00 €</span>
        </div>
        
        <div class="summary-line summary-total">
            <span>TOTAL À PAYER :</span>
            <span id="res-total">0,00 €</span>
        </div>

        <div id="echeancier-box" class="echeancier-box" style="display: none;">
            <div class="echeancier-title">Détail du paiement échelonné :</div>
            <div id="echeancier-details"></div>
        </div>
    </div>
</div>

<script>
    let adherentCount = 0;

    function ajouterAdherent() {
        adherentCount++;
        const container = document.getElementById('adherents-container');
        
        const card = document.createElement('div');
        card.className = 'adherent-card';
        card.id = `adherent-${adherentCount}`;
        
        card.innerHTML = `
            <div class="adherent-header">
                <span class="adherent-title">Adhérent #${adherentCount}</span>
                ${adherentCount > 1 ? `<button class="btn-remove" onclick="supprimerAdherent(${adherentCount})">🗑️ Supprimer</button>` : ''}
            </div>
            
            <div class="grid-2">
                <div>
                    <label>Date de naissance (optionnel) :</label>
                    <input type="date" onchange="calculerAgeAuto(${adherentCount}, this.value)">
                </div>
                <div>
                    <label>Tranche d'Adhésion :</label>
                    <select class="select-adhesion" id="adhesion-select-${adherentCount}" onchange="calculerTotaux()">
                        <option value="20">Adulte (18 ans et +) - 20€</option>
                        <option value="10">Jeune (12-17 ans) - 10€</option>
                        <option value="7">Enfant (6-11 ans) - 7€</option>
                        <option value="5">Petit (3-5 ans) - 5€</option>
                        <option value="0">Bébé (0-2 ans) - Exonéré (0€)</option>
                        <option value="0-ex">Exonéré / Autre - 0€</option>
                    </select>
                </div>
            </div>

            <div style="margin-top: 10px;">
                <label>Activités de l'adhérent :</label>
                <div id="activities-container-${adherentCount}"></div>
                <button type="button" class="btn btn-small" style="margin-top: 6px; background: #4a4a5a; color: white;" onclick="ajouterActivite(${adherentCount})">➕ Ajouter une activité</button>
            </div>
        `;
        
        container.appendChild(card);
        ajouterActivite(adherentCount);
    }

    function supprimerAdherent(id) {
        const card = document.getElementById(`adherent-${id}`);
        if (card) {
            card.remove();
            calculerTotaux();
        }
    }

    function ajouterActivite(adherentId) {
        const container = document.getElementById(`activities-container-${adherentId}`);
        const actDiv = document
